name: Extract seed list PDF
on:
  workflow_dispatch:
  push:
    branches:
      - feature/premium-storefront-v1
    paths:
      - .github/workflows/extract-seed-list.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-storefront-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Extract and map confirmed source fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import fitz

          pdf = Path("product-data/Seed List Full .pdf")
          if not pdf.exists():
              raise SystemExit(f"Missing source PDF: {pdf}")
          doc = fitz.open(pdf)
          source_text = "\n".join(page.get_text("text") for page in doc)
          types = {"Automatic Flowering", "Feminized", "Regular"}
          entries = []
          name_parts = []
          for raw in source_text.splitlines():
              line = raw.strip()
              if not line or line in {"Naam", "Type"}:
                  continue
              if line in types:
                  name = " ".join(name_parts).strip()
                  if not name:
                      raise SystemExit(f"Missing product name before type {line!r}")
                  entries.append((name, line))
                  name_parts = []
              else:
                  name_parts.append(line)
          if name_parts:
              raise SystemExit("Unexpected trailing text after final type")
          if len(entries) != 1269:
              raise SystemExit(f"Expected 1269 source entries, found {len(entries)}")
          if any(not name for name, _ in entries):
              raise SystemExit("Empty product name detected")

          output = Path("product-data/products.csv")
          fields = ["id", "name", "category", "description", "price", "currency", "stock", "image", "details", "status"]
          with output.open("w", newline="", encoding="utf-8-sig") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for i, (name, product_type) in enumerate(entries, 1):
                  writer.writerow({
                      "id": f"seed-{i:04d}",
                      "name": name,
                      "category": "",
                      "description": "",
                      "price": "",
                      "currency": "",
                      "stock": "",
                      "image": "",
                      "details": f"Typ laut PDF: {product_type}",
                      "status": "Entwurf",
                  })
          print(f"Mapped {len(entries)} source entries from {len(doc)} pages to {output}.")
          print("Only source name/type copied. Price, stock, category, descriptions and images remain blank.")
          PY
      - name: Validate generated CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path("product-data/products.csv")
          with p.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 1269, f"Expected 1269 rows, got {len(rows)}"
          assert len({r["id"] for r in rows}) == len(rows), "Duplicate IDs"
          assert all(r["name"] and r["details"].startswith("Typ laut PDF: ") for r in rows), "Missing confirmed source fields"
          assert all(r["status"] == "Entwurf" for r in rows), "Unexpected publication status"
          assert all(not r["price"] and not r["stock"] for r in rows), "Unverified price/stock must remain blank"
          print(f"CSV valid: {len(rows)} rows; unique IDs; prices/stock blank; all drafts.")
          PY
      - name: Commit mapped CSV to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-data/products.csv
          if git diff --cached --quiet; then
            echo "CSV unchanged; no commit needed."
          else
            git commit -m "Import confirmed seed names and types from PDF"
            git push origin HEAD:feature/premium-storefront-v1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: seed-list-source-text
          path: product-data/products.csv
          if-no-files-found: error
          retention-days: 7
