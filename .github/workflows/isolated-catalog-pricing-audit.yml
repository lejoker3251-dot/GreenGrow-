name: Isolated Catalog Pricing Audit

on:
  push:
    branches:
      - test/catalog-pricing-isolated-2026-10-25

permissions:
  contents: read

jobs:
  catalog-pricing-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          ref: test/catalog-pricing-isolated-2026-10-25
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused pricing unit tests
        run: node --test tests/catalog-pricing.test.mjs
      - name: Audit every catalog product and variant
        run: node scripts/audit-catalog-pricing.mjs
