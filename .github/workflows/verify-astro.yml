name: Verify GreenGrow Astro

on:
  push:
    branches: [main, feature/premium-storefront-v1]
  pull_request:
    branches: [main, feature/premium-storefront-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate imported seed catalog
        run: node scripts/validate-seed-products.mjs
      - name: Check Astro project
        run: npx astro check
      - name: Build static site
        run: npm run build
      - name: Verify expected routes and assets
        run: |
          test -s dist/index.html
          test -s dist/shop/index.html
          test -s dist/template-preview/index.html
          test -s dist/shopping-cart/index.html
          test -s dist/product/seed-0001/index.html
          test -s dist/products/hero-seedling.svg
