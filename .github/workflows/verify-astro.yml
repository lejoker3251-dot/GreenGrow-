name: Verify GreenGrow Astro

on:
  push:
    branches: [main, feature/premium-storefront-v1]
  pull_request:
    branches: [main, feature/premium-storefront-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm install --no-package-lock
      - name: Validate imported seed catalog
        run: node scripts/validate-seed-products.mjs
      - name: Check CSV/JSON catalog consistency
        run: node scripts/validate-catalog-consistency.mjs
      - name: Validate category mapping and image paths
        run: node scripts/validate-catalog-categories-and-images.mjs
      - name: Test botanical hero scene lifecycle
        run: node scripts/test-botanical-hero-scene.mjs
      - name: Check Astro project
        run: npx astro check
      - name: Build static site
        run: npm run build
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Test botanical hero fallback and responsive layout
        run: node scripts/test-botanical-hero-browser.mjs
      - name: Verify expected routes and assets
        run: |
          test -s dist/index.html
          test -s dist/shop/index.html
          test -s dist/template-preview/index.html
          test -s dist/shopping-cart/index.html
          test -s dist/product/seed-0001/index.html
          test -s dist/products/hero-seedling.svg

  master-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/master-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install master agent dependencies
        run: npm install --no-package-lock
      - name: Type-check master agent
        run: npm run typecheck
      - name: Test master agent request handlers
        run: npm test
