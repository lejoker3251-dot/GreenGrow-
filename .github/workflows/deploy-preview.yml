name: Deploy GreenGrow Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/premium-storefront-v1

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Protect production and enforce preview branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/feature/premium-storefront-v1" ]; then
            echo "::error::Preview deployment is restricted to feature/premium-storefront-v1. No deployment was attempted."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Type-check Astro
        run: npx astro check
      - name: Build static site
        run: npm run build
      - name: Verify build output and page identity
        run: |
          test -s dist/index.html
          test -s dist/template-preview/index.html
          test -s dist/shopping-cart/index.html
          test -s dist/product/seed-0001/index.html
          grep -q "Reliable product navigation for touch devices" src/pages/shop.astro
          grep -q "window.location.assign(destination)" src/pages/shop.astro
          test -s dist/products/hero-seedling.svg
          grep -q "Ein kleines Wunder" dist/index.html
          grep -q "grow-doctor" dist/index.html
          grep -q "/shop/" dist/index.html
          grep -q 'id="catalog-data"' dist/shop/index.html
          grep -q 'id="catalog-load-more"' dist/shop/index.html
          grep -q "Ein Katalogeintrag in Prüfung" src/pages/product/[id].astro
          echo "Build contains expected SEED³X homepage and progressive catalog markers."
      - name: Deploy isolated preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          npx wrangler deploy --config wrangler.preview.jsonc 2>&1 | tee /tmp/wrangler-deploy.log
          PREVIEW_URL="$(grep -Eo 'https://greengrow-preview[^[:space:]]*workers\.dev' /tmp/wrangler-deploy.log | tail -n 1)"
          test -n "$PREVIEW_URL" || (echo "Could not detect preview URL from Wrangler output" && exit 1)
          echo "Preview URL: $PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
      - name: Verify deployed preview is reachable and correct
        run: |
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 "$PREVIEW_URL/" -o /tmp/preview.html
          test -s /tmp/preview.html
          grep -q "Ein kleines Wunder" /tmp/preview.html
          grep -q "grow-doctor" /tmp/preview.html
          grep -q "/shop/" /tmp/preview.html
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 "$PREVIEW_URL/shop/" -o /tmp/preview-shop.html
          grep -q 'id="catalog-data"' /tmp/preview-shop.html
          grep -q 'id="catalog-load-more"' /tmp/preview-shop.html
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 "$PREVIEW_URL/product/seed-0001/" -o /tmp/preview-product.html
          test -s /tmp/preview-product.html
          grep -q "KATALOG-ID" /tmp/preview-product.html
          echo "Preview homepage, progressive catalog markers, and product detail route are reachable."
