name: Isolated Inventory Spike Tests

on:
  push:
    branches:
      - test/inventory-ean-pricing-2026-10-25
    paths:
      - "agents/inventory-spike/**"
      - ".github/workflows/inventory-spike-tests.yml"

permissions:
  contents: read

jobs:
  inventory-spike:
    if: github.ref == 'refs/heads/test/inventory-ean-pricing-2026-10-25'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/inventory-spike
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          ref: test/inventory-ean-pricing-2026-10-25
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated test dependencies
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
      - name: Run Durable Object transaction and concurrency tests
        run: npm test
      - name: Type-check prototype
        run: npm run typecheck
